                                      <constraint firstItem="Lg5-9F-ptr" firstAttribute="centerY" secondItem="Ze5-6b-2t3" secondAttribute="centerY" constant="-60" id="cy-img"/>
                                      <constraint firstItem="Lbl-01-aaa" firstAttribute="top" secondItem="Lg5-9F-ptr" secondAttribute="bottom" constant="20" id="tp-l1"/>
