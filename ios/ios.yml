      - name: Описываем проект
        run: |
          set -e
          cat > ios/project.yml <<'EOF'
          name: Avtopark
          options:
            bundleIdPrefix: su.avtopark
            deploymentTarget:
              iOS: "15.0"
            createIntermediateGroups: true
            developmentLanguage: ru
            # Формат файла проекта: новые версии генератора пишут вариант,
            # который открывает только Xcode 16. Закрепляем совместимый.
            objectVersion: 54
            xcodeVersion: "1540"

          settings:
            base:
              MARKETING_VERSION: "${{ env.APP_VERSION }}"
              CURRENT_PROJECT_VERSION: "${{ env.BUILD_NUMBER }}"
              SWIFT_VERSION: "5.0"
              ENABLE_USER_SCRIPT_SANDBOXING: "NO"
              ALWAYS_SEARCH_USER_PATHS: "NO"
              CLANG_ENABLE_MODULES: "YES"

          targets:
            Avtopark:
              type: application
              platform: iOS
              sources:
                - path: Sources
                - path: Resources
                  excludes:
                    - "Info.plist"
              settings:
                base:
                  PRODUCT_NAME: Avtopark
                  PRODUCT_BUNDLE_IDENTIFIER: su.avtopark.app
                  INFOPLIST_FILE: Resources/Info.plist
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  TARGETED_DEVICE_FAMILY: "1,2"
                  SUPPORTS_MACCATALYST: "NO"
                  SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
                  GENERATE_INFOPLIST_FILE: "NO"
                  CODE_SIGN_STYLE: Manual
                  SWIFT_OPTIMIZATION_LEVEL: "-Onone"
                configs:
                  Release:
                    SWIFT_OPTIMIZATION_LEVEL: "-O"
                    SWIFT_COMPILATION_MODE: wholemodule
          EOF

      - name: Ставим генератор и собираем проект
        working-directory: ios
        run: |
          set -e
          brew install xcodegen
          xcodegen generate
          ls -la Avtopark.xcodeproj

          # Формат файла проекта должен быть по зубам установленному Xcode.
          FMT=$(grep -m1 objectVersion Avtopark.xcodeproj/project.pbxproj | tr -dc '0-9')
          echo "формат файла проекта: $FMT"
          if [ "$FMT" -gt 60 ]; then
            echo "Формат слишком новый, понижаем до совместимого."
            sed -i '' "s/objectVersion = $FMT;/objectVersion = 54;/" Avtopark.xcodeproj/project.pbxproj
            grep -m1 objectVersion Avtopark.xcodeproj/project.pbxproj
          fi

          # Проверяем, что Xcode действительно открывает проект.
          xcodebuild -list -project Avtopark.xcodeproj

      # --- Проверочная сборка: ключи Apple не нужны ---

      - name: Проверяем сборку без подписи
        if: inputs.mode == 'check'
        working-directory: ios
        run: |
          set -eo pipefail
          xcodebuild clean build \
            -project Avtopark.xcodeproj \
            -scheme Avtopark \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -quiet
          echo "Сборка прошла успешно."

      # --- Подписанная сборка для TestFlight ---

      - name: Ставим сертификат разработчика
        if: inputs.mode == 'testflight'
        env:
          CERT_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -e
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEY_PASS=$(uuidgen)

          security create-keychain -p "$KEY_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEY_PASS" "$KEYCHAIN"

          echo "$CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEY_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE" | base64 --decode > "$PROFILE_DIR/app.mobileprovision"

          UUID=$(security cms -D -i "$PROFILE_DIR/app.mobileprovision" | plutil -extract UUID raw -o - -)
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
          rm -f $RUNNER_TEMP/cert.p12

      - name: Собираем архив
        if: inputs.mode == 'testflight'
        working-directory: ios
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -eo pipefail
          xcodebuild archive \
            -project Avtopark.xcodeproj \
            -scheme Avtopark \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Avtopark.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Готовим файл для App Store
        if: inputs.mode == 'testflight'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -e
          cat > $RUNNER_TEMP/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>su.avtopark.app</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Avtopark.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Отправляем в TestFlight
        if: inputs.mode == 'testflight'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/private_keys
          # Ключ принимаем в любом виде: как обычный текст из файла .p8
          # или перекодированным — разбираемся по первой строке.
          if echo "$KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8
          else
            echo "$KEY_P8" | base64 --decode > ~/private_keys/AuthKey_$KEY_ID.p8
          fi

          xcrun altool --upload-app -f $RUNNER_TEMP/export/Avtopark.ipa \
            -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

          rm -rf ~/private_keys

      - name: Сохраняем готовый файл
        if: inputs.mode == 'testflight'
        uses: actions/upload-artifact@v4
        with:
          name: Avtopark-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Чистим ключи
        if: always() && inputs.mode == 'testflight'
        run: |
          security delete-keychain $RUNNER_TEMP/build.keychain || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision" || true
