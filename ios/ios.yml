name: Сборка для iPhone (Автопарк)

# Файл самодостаточный: проект для iPhone создаётся прямо на сборочном сервере.
# Запуск вручную: вкладка Actions → этот процесс → Run workflow.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Что собрать"
        required: true
        default: check
        type: choice
        options:
          - check       # проверка сборки без подписи, ключи Apple не нужны
          - testflight  # подписанный архив и выгрузка в TestFlight

env:
  APP_NAME: Avtopark
  BUNDLE_ID: su.avtopark.app
  SITE_URL: https://xn--80aaf7asgim.su
  APP_VERSION: "1.0"
  BUILD_NUMBER: "1"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Получаем исходники
        uses: actions/checkout@v4

      - name: Выбираем Xcode
        run: |
          # Apple принимает только приложения, собранные в Xcode 26 и новее,
          # поэтому всегда берём самую свежую версию на машине.
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Используем $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Создаём структуру проекта
        run: |
          set -e
          mkdir -p ios/Sources
          mkdir -p ios/Resources/Assets.xcassets/AppIcon.appiconset
          mkdir -p ios/Resources/Assets.xcassets/BrandColor.colorset
          mkdir -p ios/Resources/Assets.xcassets/SplashLogo.imageset

      - name: Готовим иконку и заставку
        run: |
          set -ex
          # Работаем только штатной утилитой macOS sips — доустанавливать ничего не нужно.

          # Эмблему берём из проекта, а если её там нет — с рабочего сайта.
          if [ -f public/emblem.png ]; then
            cp public/emblem.png /tmp/emblem.png
          else
            curl -sSL --max-time 60 "$SITE_URL/emblem.png" -o /tmp/emblem.png
          fi

          ls -lh /tmp/emblem.png
          sips -g pixelWidth -g pixelHeight -g hasAlpha /tmp/emblem.png

          ICONSET=ios/Resources/Assets.xcassets/AppIcon.appiconset
          SPLASH=ios/Resources/Assets.xcassets/SplashLogo.imageset

          # Заставка — с прозрачностью, она ложится на светлый фон экрана запуска.
          sips -s format png -z 120 120  /tmp/emblem.png --out "$SPLASH/splash.png"    >/dev/null
          sips -s format png -z 240 240  /tmp/emblem.png --out "$SPLASH/splash@2x.png" >/dev/null
          sips -s format png -z 360 360  /tmp/emblem.png --out "$SPLASH/splash@3x.png" >/dev/null

          # Иконка приложения уже подготовлена заранее и лежит в проекте:
          # 1024x1024, белый фон, без альфа-канала — ровно как требует Apple.
          # Обрабатывать её на сервере нельзя: sips возвращает прозрачность обратно.
          if [ -f public/ios-icon-1024.png ]; then
            cp public/ios-icon-1024.png "$ICONSET/icon-1024.png"
          else
            curl -sSL --max-time 60 "$SITE_URL/ios-icon-1024.png" -o "$ICONSET/icon-1024.png"
          fi

          # Контрольная проверка: размер и отсутствие прозрачности.
          ALPHA=$(sips -g hasAlpha "$ICONSET/icon-1024.png" | tail -1 | awk '{print $2}')
          W=$(sips -g pixelWidth "$ICONSET/icon-1024.png" | tail -1 | awk '{print $2}')
          H=$(sips -g pixelHeight "$ICONSET/icon-1024.png" | tail -1 | awk '{print $2}')
          echo "иконка: ${W}x${H}, прозрачность: $ALPHA"

          if [ "$ALPHA" = "yes" ]; then
            echo "ОШИБКА: Apple отклонит иконку с прозрачностью"
            exit 1
          fi
          if [ "$W" != "1024" ] || [ "$H" != "1024" ]; then
            echo "ОШИБКА: размер иконки должен быть ровно 1024x1024"
            exit 1
          fi

      - name: Описываем наборы картинок
        run: |
          set -e
          cat > ios/Resources/Assets.xcassets/Contents.json <<'EOF'
          { "info" : { "author" : "xcode", "version" : 1 } }
          EOF

          cat > ios/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json <<'EOF'
          {
            "images" : [
              { "filename" : "icon-1024.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

          cat > ios/Resources/Assets.xcassets/BrandColor.colorset/Contents.json <<'EOF'
          {
            "colors" : [
              { "color" : { "color-space" : "srgb",
                "components" : { "alpha" : "1.000", "blue" : "0x05", "green" : "0x05", "red" : "0x05" } },
                "idiom" : "universal" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

          cat > ios/Resources/Assets.xcassets/SplashLogo.imageset/Contents.json <<'EOF'
          {
            "images" : [
              { "filename" : "splash.png", "idiom" : "universal", "scale" : "1x" },
              { "filename" : "splash@2x.png", "idiom" : "universal", "scale" : "2x" },
              { "filename" : "splash@3x.png", "idiom" : "universal", "scale" : "3x" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

      - name: Пишем код приложения
        run: |
          set -e
          cat > ios/Sources/AppDelegate.swift <<'EOF'
          import UIKit

          @main
          final class AppDelegate: UIResponder, UIApplicationDelegate {

              var window: UIWindow?

              func application(_ app: UIApplication,
                               didFinishLaunchingWithOptions opts: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let w = UIWindow(frame: UIScreen.main.bounds)
                  w.rootViewController = ViewController()
                  w.makeKeyAndVisible()
                  window = w
                  return true
              }

              /// На телефоне работаем вертикально, на планшете — в любом положении.
              func application(_ app: UIApplication,
                               supportedInterfaceOrientationsFor window: UIWindow?) -> UIInterfaceOrientationMask {
                  UIDevice.current.userInterfaceIdiom == .pad ? .all : .portrait
              }
          }
          EOF

          cat > ios/Sources/ViewController.swift <<'EOF'
          import UIKit
          import WebKit
          import CoreLocation
          import StoreKit

          /// Главный экран: Автопарк внутри веб-контейнера.
          final class ViewController: UIViewController {

              private let host = "https://xn--80aaf7asgim.su"
              private var site: URL { URL(string: host + "/")! }

              private var web: WKWebView!
              private var progress: UIProgressView!
              private var refreshButton: UIButton!
              private let locationManager = CLLocationManager()
              private var offlineView: UIView?
              private var progressObs: NSKeyValueObservation?
              private var locationAsked = false
              private lazy var purchases = Purchases(owner: self)
              private lazy var printer = DocPrinter(owner: self)

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = UIColor(named: "BrandColor") ?? .systemBackground
                  buildWebView()
                  buildProgressBar()
                  buildRefreshButton()
                  observeProgress()
                  load()
              }

              override var preferredStatusBarStyle: UIStatusBarStyle { .lightContent }

              private func buildWebView() {
                  let cfg = WKWebViewConfiguration()

                  // Видео инструктажей не разворачиваем на весь экран принудительно.
                  cfg.allowsInlineMediaPlayback = true
                  cfg.mediaTypesRequiringUserActionForPlayback = []

                  // Общее хранилище: вход и настройки сохраняются между запусками.
                  cfg.websiteDataStore = .default()
                  cfg.processPool = WKProcessPool()

                  let prefs = WKPreferences()
                  prefs.javaScriptCanOpenWindowsAutomatically = true
                  cfg.preferences = prefs

                  // Признак приложения — штатный способ, без частных интерфейсов.
                  cfg.applicationNameForUserAgent = "Avtopark/1.0 (iOS)"

                  if #available(iOS 14.0, *) {
                      cfg.defaultWebpagePreferences.allowsContentJavaScript = true
                  }

                  // Встроенная покупка полного доступа: страница зовёт App Store
                  // через мост «iap», ответ возвращаем в window.__iapResult.
                  cfg.userContentController.add(purchases, name: "iap")

                  // Печать документов: системное окно печати iOS (принтер AirPrint
                  // или «Сохранить в Файлы» как PDF).
                  cfg.userContentController.add(printer, name: "docPrint")

                  web = WKWebView(frame: .zero, configuration: cfg)
                  web.translatesAutoresizingMaskIntoConstraints = false
                  web.navigationDelegate = self
                  web.uiDelegate = self
                  web.allowsBackForwardNavigationGestures = true
                  web.scrollView.contentInsetAdjustmentBehavior = .never
                  web.backgroundColor = UIColor(named: "BrandColor") ?? .systemBackground
                  web.isOpaque = false

                  view.addSubview(web)
                  NSLayoutConstraint.activate([
                      web.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor),
                      web.bottomAnchor.constraint(equalTo: view.bottomAnchor),
                      web.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      web.trailingAnchor.constraint(equalTo: view.trailingAnchor)
                  ])
              }

              private func buildProgressBar() {
                  progress = UIProgressView(progressViewStyle: .bar)
                  progress.translatesAutoresizingMaskIntoConstraints = false
                  progress.progressTintColor = UIColor(red: 0.84, green: 0.67, blue: 0.33, alpha: 1)
                  progress.trackTintColor = .clear
                  progress.alpha = 0
                  view.addSubview(progress)

                  NSLayoutConstraint.activate([
                      progress.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor),
                      progress.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      progress.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      progress.heightAnchor.constraint(equalToConstant: 2.5)
                  ])
              }

              /// Круглая кнопка обновления в правом нижнем углу — как в версии для Android.
              private func buildRefreshButton() {
                  refreshButton = UIButton(type: .system)
                  refreshButton.translatesAutoresizingMaskIntoConstraints = false
                  refreshButton.backgroundColor = UIColor(white: 0.1, alpha: 0.92)
                  refreshButton.tintColor = UIColor(red: 0.84, green: 0.67, blue: 0.33, alpha: 1)
                  refreshButton.layer.cornerRadius = 24
                  refreshButton.layer.shadowColor = UIColor.black.cgColor
                  refreshButton.layer.shadowOpacity = 0.18
                  refreshButton.layer.shadowRadius = 5
                  refreshButton.layer.shadowOffset = CGSize(width: 0, height: 2)
                  refreshButton.alpha = 0.55
                  refreshButton.accessibilityLabel = "Обновить страницу"

                  let symbol = UIImage.SymbolConfiguration(pointSize: 19, weight: .medium)
                  refreshButton.setImage(UIImage(systemName: "arrow.clockwise", withConfiguration: symbol), for: .normal)
                  refreshButton.addTarget(self, action: #selector(reloadTapped), for: .touchUpInside)

                  view.addSubview(refreshButton)
                  NSLayoutConstraint.activate([
                      refreshButton.widthAnchor.constraint(equalToConstant: 48),
                      refreshButton.heightAnchor.constraint(equalToConstant: 48),
                      refreshButton.trailingAnchor.constraint(
                          equalTo: view.safeAreaLayoutGuide.trailingAnchor, constant: -14),
                      refreshButton.bottomAnchor.constraint(
                          equalTo: view.safeAreaLayoutGuide.bottomAnchor, constant: -14)
                  ])
              }

              private func observeProgress() {
                  progressObs = web.observe(\.estimatedProgress, options: .new) { [weak self] w, _ in
                      guard let self = self else { return }
                      let done = w.estimatedProgress >= 1
                      self.progress.setProgress(Float(w.estimatedProgress), animated: true)
                      UIView.animate(withDuration: 0.25) { self.progress.alpha = done ? 0 : 1 }
                      if done { self.progress.setProgress(0, animated: false) }
                  }
              }

              private func load() {
                  var req = URLRequest(url: site)
                  req.cachePolicy = .useProtocolCachePolicy
                  req.timeoutInterval = 25
                  web.load(req)
              }

              /// Передаёт ответ странице.
              func runScript(_ js: String) {
                  web.evaluateJavaScript(js, completionHandler: nil)
              }

              @objc private func reloadTapped() {
                  refreshButton.alpha = 1
                  offlineView?.removeFromSuperview()
                  offlineView = nil

                  if web.url == nil {
                      load()
                  } else {
                      web.reloadFromOrigin()
                  }

                  UIView.animate(withDuration: 0.3, delay: 1.2) { self.refreshButton.alpha = 0.55 }
              }

              /// Запрашиваем геолокацию заранее, чтобы фотофиксация сразу получала координаты.
              func prepareLocation() {
                  guard !locationAsked else { return }
                  if locationManager.authorizationStatus == .notDetermined {
                      locationAsked = true
                      locationManager.requestWhenInUseAuthorization()
                  }
              }

              private func showOffline() {
                  guard offlineView == nil else { return }

                  let box = UIView()
                  box.translatesAutoresizingMaskIntoConstraints = false
                  box.backgroundColor = UIColor(named: "BrandColor") ?? .systemBackground

                  let icon = UIImageView(image: UIImage(systemName: "wifi.slash"))
                  icon.tintColor = .secondaryLabel
                  icon.contentMode = .scaleAspectFit
                  icon.translatesAutoresizingMaskIntoConstraints = false

                  let title = UILabel()
                  title.text = "Нет подключения к интернету"
                  title.font = .systemFont(ofSize: 18, weight: .semibold)
                  title.textColor = .label
                  title.textAlignment = .center
                  title.numberOfLines = 0
                  title.translatesAutoresizingMaskIntoConstraints = false

                  let hint = UILabel()
                  hint.text = "Проверьте связь на объекте и повторите попытку."
                  hint.font = .systemFont(ofSize: 15)
                  hint.textColor = .secondaryLabel
                  hint.textAlignment = .center
                  hint.numberOfLines = 0
                  hint.translatesAutoresizingMaskIntoConstraints = false

                  let retry = UIButton(type: .system)
                  retry.setTitle("Повторить", for: .normal)
                  retry.titleLabel?.font = .systemFont(ofSize: 16, weight: .semibold)
                  retry.backgroundColor = UIColor(red: 0.84, green: 0.67, blue: 0.33, alpha: 1)
                  retry.setTitleColor(.white, for: .normal)
                  retry.layer.cornerRadius = 6
                  retry.translatesAutoresizingMaskIntoConstraints = false
                  retry.addTarget(self, action: #selector(reloadTapped), for: .touchUpInside)

                  box.addSubview(icon)
                  box.addSubview(title)
                  box.addSubview(hint)
                  box.addSubview(retry)
                  view.addSubview(box)
                  offlineView = box

                  NSLayoutConstraint.activate([
                      box.topAnchor.constraint(equalTo: view.topAnchor),
                      box.bottomAnchor.constraint(equalTo: view.bottomAnchor),
                      box.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      box.trailingAnchor.constraint(equalTo: view.trailingAnchor),

                      icon.centerXAnchor.constraint(equalTo: box.centerXAnchor),
                      icon.centerYAnchor.constraint(equalTo: box.centerYAnchor, constant: -90),
                      icon.widthAnchor.constraint(equalToConstant: 54),
                      icon.heightAnchor.constraint(equalToConstant: 54),

                      title.topAnchor.constraint(equalTo: icon.bottomAnchor, constant: 18),
                      title.leadingAnchor.constraint(equalTo: box.leadingAnchor, constant: 32),
                      title.trailingAnchor.constraint(equalTo: box.trailingAnchor, constant: -32),

                      hint.topAnchor.constraint(equalTo: title.bottomAnchor, constant: 8),
                      hint.leadingAnchor.constraint(equalTo: box.leadingAnchor, constant: 32),
                      hint.trailingAnchor.constraint(equalTo: box.trailingAnchor, constant: -32),

                      retry.topAnchor.constraint(equalTo: hint.bottomAnchor, constant: 22),
                      retry.centerXAnchor.constraint(equalTo: box.centerXAnchor),
                      retry.widthAnchor.constraint(equalToConstant: 170),
                      retry.heightAnchor.constraint(equalToConstant: 46)
                  ])
              }
          }

          extension ViewController: WKNavigationDelegate {

              func webView(_ w: WKWebView,
                           decidePolicyFor action: WKNavigationAction,
                           decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {

                  guard let url = action.request.url else {
                      decisionHandler(.allow)
                      return
                  }
                  let s = url.absoluteString

                  // Телефон, почта и мессенджеры открываем системно.
                  let external = ["tel:", "mailto:", "sms:", "whatsapp:", "tg:", "maps:"]
                  if external.contains(where: { s.hasPrefix($0) }) {
                      UIApplication.shared.open(url)
                      decisionHandler(.cancel)
                      return
                  }

                  // Ссылки на сторонние сайты уводим в Safari, чтобы не запирать пользователя.
                  if let h = url.host,
                     !h.contains("xn--80aaf7asgim.su"),
                     !h.contains("poehali.dev"),
                     action.navigationType == .linkActivated {
                      UIApplication.shared.open(url)
                      decisionHandler(.cancel)
                      return
                  }

                  decisionHandler(.allow)
              }

              func webView(_ w: WKWebView, didFinish nav: WKNavigation!) {
                  offlineView?.removeFromSuperview()
                  offlineView = nil
                  prepareLocation()
              }

              func webView(_ w: WKWebView, didFail nav: WKNavigation!, withError e: Error) {
                  handle(e)
              }

              func webView(_ w: WKWebView, didFailProvisionalNavigation nav: WKNavigation!, withError e: Error) {
                  handle(e)
              }

              private func handle(_ e: Error) {
                  // Отменённая навигация — не ошибка связи, экран показывать не нужно.
                  guard (e as NSError).code != NSURLErrorCancelled else { return }
                  showOffline()
              }
          }

          extension ViewController: WKUIDelegate {

              /// Ссылки с target=_blank открываем в том же окне, иначе они молча теряются.
              func webView(_ w: WKWebView,
                           createWebViewWith cfg: WKWebViewConfiguration,
                           for action: WKNavigationAction,
                           windowFeatures: WKWindowFeatures) -> WKWebView? {
                  if action.targetFrame == nil, let url = action.request.url {
                      w.load(URLRequest(url: url))
                  }
                  return nil
              }

              /// Запрос камеры и микрофона передаём системному диалогу iOS.
              @available(iOS 15.0, *)
              func webView(_ w: WKWebView,
                           requestMediaCapturePermissionFor origin: WKSecurityOrigin,
                           initiatedByFrame frame: WKFrameInfo,
                           type: WKMediaCaptureType,
                           decisionHandler: @escaping (WKPermissionDecision) -> Void) {
                  decisionHandler(.prompt)
              }

              func webView(_ w: WKWebView, runJavaScriptAlertPanelWithMessage msg: String,
                           initiatedByFrame f: WKFrameInfo,
                           completionHandler done: @escaping () -> Void) {
                  let a = UIAlertController(title: nil, message: msg, preferredStyle: .alert)
                  a.addAction(UIAlertAction(title: "ОК", style: .default) { _ in done() })
                  present(a, animated: true)
              }

              func webView(_ w: WKWebView, runJavaScriptConfirmPanelWithMessage msg: String,
                           initiatedByFrame f: WKFrameInfo,
                           completionHandler done: @escaping (Bool) -> Void) {
                  let a = UIAlertController(title: nil, message: msg, preferredStyle: .alert)
                  a.addAction(UIAlertAction(title: "Отмена", style: .cancel) { _ in done(false) })
                  a.addAction(UIAlertAction(title: "ОК", style: .default) { _ in done(true) })
                  present(a, animated: true)
              }

              func webView(_ w: WKWebView, runJavaScriptTextInputPanelWithPrompt prompt: String,
                           defaultText: String?, initiatedByFrame f: WKFrameInfo,
                           completionHandler done: @escaping (String?) -> Void) {
                  let a = UIAlertController(title: nil, message: prompt, preferredStyle: .alert)
                  a.addTextField { $0.text = defaultText }
                  a.addAction(UIAlertAction(title: "Отмена", style: .cancel) { _ in done(nil) })
                  a.addAction(UIAlertAction(title: "ОК", style: .default) { _ in
                      done(a.textFields?.first?.text)
                  })
                  present(a, animated: true)
              }
          }

          /// Печать документа, присланного страницей (HTML).
          final class DocPrinter: NSObject, WKScriptMessageHandler {
              private weak var owner: UIViewController?

              init(owner: UIViewController) {
                  self.owner = owner
                  super.init()
              }

              func userContentController(_ c: WKUserContentController, didReceive m: WKScriptMessage) {
                  guard let body = m.body as? [String: Any],
                        let html = body["html"] as? String else { return }
                  let title = (body["title"] as? String) ?? "Документ"
                  DispatchQueue.main.async {
                      let info = UIPrintInfo(dictionary: nil)
                      info.outputType = .general
                      info.jobName = title
                      let pc = UIPrintInteractionController.shared
                      pc.printInfo = info
                      pc.printFormatter = UIMarkupTextPrintFormatter(markupText: html)
                      if UIDevice.current.userInterfaceIdiom == .pad, let v = self.owner?.view {
                          let r = CGRect(x: v.bounds.midX, y: v.bounds.midY, width: 1, height: 1)
                          pc.present(from: r, in: v, animated: true, completionHandler: nil)
                      } else {
                          pc.present(animated: true, completionHandler: nil)
                      }
                  }
              }
          }

          /// Покупка полного доступа через App Store (StoreKit 2).
          ///
          /// Окно оплаты показывает система. Странице возвращаем подписанную
          /// Apple транзакцию — сервер сам проверяет подпись и открывает доступ.
          /// Подписка не используется: покупка разовая, для всей компании.
          final class Purchases: NSObject, WKScriptMessageHandler {
              private weak var owner: ViewController?
              private var updates: Task<Void, Never>?

              init(owner: ViewController) {
                  self.owner = owner
                  super.init()
                  // Покупки, подтверждённые позже (например, родителем через
                  // «Попросить купить»), закрываем, чтобы App Store не повторял их.
                  updates = Task.detached {
                      for await result in Transaction.updates {
                          if case .verified(let tx) = result { await tx.finish() }
                      }
                  }
              }

              deinit { updates?.cancel() }

              func userContentController(_ c: WKUserContentController, didReceive m: WKScriptMessage) {
                  guard let body = m.body as? [String: Any],
                        let action = body["action"] as? String,
                        let productId = body["productId"] as? String else { return }
                  Task { @MainActor in
                      let reply: [String: Any]
                      switch action {
                      case "buy": reply = await self.buy(productId)
                      case "restore": reply = await self.restore(productId)
                      case "price": reply = await self.price(productId)
                      default: reply = ["ok": false, "error": "failed"]
                      }
                      self.send(reply)
                  }
              }

              private func price(_ id: String) async -> [String: Any] {
                  guard let p = try? await Product.products(for: [id]).first else {
                      return ["ok": false, "error": "not_found"]
                  }
                  return ["ok": true, "price": p.displayPrice]
              }

              private func buy(_ id: String) async -> [String: Any] {
                  do {
                      guard let p = try await Product.products(for: [id]).first else {
                          return ["ok": false, "error": "not_found"]
                      }
                      switch try await p.purchase() {
                      case .success(let result):
                          guard case .verified(let tx) = result else {
                              return ["ok": false, "error": "failed"]
                          }
                          await tx.finish()
                          return ["ok": true, "jws": result.jwsRepresentation]
                      case .userCancelled:
                          return ["ok": false, "error": "cancelled"]
                      case .pending:
                          return ["ok": false, "error": "pending"]
                      @unknown default:
                          return ["ok": false, "error": "failed"]
                      }
                  } catch {
                      return ["ok": false, "error": "failed"]
                  }
              }

              private func restore(_ id: String) async -> [String: Any] {
                  try? await AppStore.sync()
                  for await result in Transaction.currentEntitlements {
                      if case .verified(let tx) = result, tx.productID == id {
                          return ["ok": true, "jws": result.jwsRepresentation]
                      }
                  }
                  return ["ok": false, "error": "not_found"]
              }

              @MainActor private func send(_ reply: [String: Any]) {
                  guard let data = try? JSONSerialization.data(withJSONObject: reply),
                        let json = String(data: data, encoding: .utf8) else { return }
                  owner?.runScript("window.__iapResult && window.__iapResult(\(json))")
              }
          }
          EOF

      - name: Пишем настройки приложения
        run: |
          set -e
          cat > ios/Resources/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>ru_RU</string>
              <key>CFBundleDisplayName</key>
              <string>Автопарк</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$(MARKETING_VERSION)</string>
              <key>CFBundleVersion</key>
              <string>$(CURRENT_PROJECT_VERSION)</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UIUserInterfaceStyle</key>
              <string>Dark</string>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <true/>

              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>

              <key>NSCameraUsageDescription</key>
              <string>Камера нужна, чтобы фотографировать автомобили, документы и чеки для учёта автопарка.</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>Доступ к фотографиям нужен, чтобы прикрепить к карточке автомобиля снимки документов, полисов и чеков.</string>
              <key>NSPhotoLibraryAddUsageDescription</key>
              <string>Сохранение фотографий и документов автомобиля на устройство.</string>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>Геопозиция нужна навигатору, чтобы показать вас на карте, построить маршрут и вести по нему с голосовыми подсказками.</string>
              <key>NSMicrophoneUsageDescription</key>
              <string>Микрофон используется для голосового ввода заметок.</string>

              <key>NSSpeechRecognitionUsageDescription</key>
              <string>Распознавание речи переводит надиктованную заметку в текст. Запись голоса не сохраняется и не передаётся.</string>

              <key>ITSAppUsesNonExemptEncryption</key>
              <false/>

              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <false/>
              </dict>
          </dict>
          </plist>
          EOF

          plutil -lint ios/Resources/Info.plist

      - name: Пишем экран запуска
        run: |
          set -e
          cat > ios/Resources/LaunchScreen.storyboard <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="22505" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <device id="retina6_12" orientation="portrait" appearance="dark"/>
              <dependencies>
